<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="סייר וסימולטור לכל הבחירות לכנסת מאז 1949, עם חלוקת המנדטים לפי החוק של כל תקופה · Explore and simulate every Knesset election since 1949, with seats allocated under each era's own law." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>סייר הבחירות לכנסת · Israeli Elections Explorer</title>
    <!-- Download the default election (openElection('k26') in src/app/App.tsx) alongside the script
         instead of after it runs. crossorigin matches fetch()'s defaults, so the response is reused. -->
    <link rel="preload" href="data/k26.json" as="fetch" crossorigin />
    <!-- The theme before the first paint (store.ts resolves it the same way): a stored choice, else the device's.
         Without this, a dark device would flash the light page until the app starts. -->
    <script>try { var v = JSON.parse(localStorage.getItem('israel-elections:settings') || 'null'), t = v && v.v === 2 && v.values && v.values.theme; if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <!-- The language and direction before the first paint, in src/app/startLanguage.ts's order: a stored language,
         else ?lang=he|en, else the address (.il Hebrew, .com English), else Hebrew. tests/start-language.test.ts runs it. -->
    <script>(function () { var l = null, h; try { var s = JSON.parse(localStorage.getItem('israel-elections:v1') || 'null'); l = s && s.lang; } catch (e) {} try { if (l !== 'he' && l !== 'en') l = (new URLSearchParams(location.search).get('lang') || '').trim().toLowerCase(); if (l !== 'he' && l !== 'en') { h = location.hostname.trim().toLowerCase().replace(/\.$/, ''); l = /\.il$/.test(h) ? 'he' : /\.com$/.test(h) ? 'en' : 'he'; } document.documentElement.lang = l; document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr'; } catch (e) {} })();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
