<title>الموحدة تصدر نشرتها الانتخابية: إحنا اللي غيّرنا نتنياهو، وبس إحنا بنغيّره

أصدرت القائمة العربية الموحدة نشرتها الانتخابية الأولى &quot;نحو تأثير أكبر&quot;، وثّقت فيها العديد من الخطط والميزانيات والمشاريع التي حصّلتها الموحدة بدخولها ائتلاف حكومة التغيير السابقة عندما أطاحت بنتنياهو إلى المعارضة، كما قدمت برنامج عملها في الإطار العام لما بعد الانتخابات، ونبذة عن المرشحين.

وتصدّر النشرة على صفحتها الأولى هدف الموحدة في هذه الانتخابات: &quot;إحنا اللي غيّرنا نتنياهو، وبس إحنا بنغيّره&quot;، وشرحت في صفحتها الأخيرة لماذا &quot;بس الموحدة بتغيّر هاي الحكومة&quot;، مؤكدة أنه بدون موحدة قوية وكبيرة مع 8 مقاعد على الأقل لن يتشكل ائتلاف تغيير جديد مكوّن من 61 نائبًا، ولن تتغير الحكومة الحالية، وبالتالي توجهت لكل مواطن عربي يريد أن يكون لصوته تأثير: &quot;إحسبها صح&quot;، و&quot;صوتك للموحدة هو اللي يغيّر هذه الحكومة&quot;.
